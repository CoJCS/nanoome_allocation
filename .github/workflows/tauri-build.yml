# macOS / Windows Tauri 앱 동시 빌드 (GitHub Actions matrix)
# - 수동 실행: Actions 탭 → "Tauri build" → Run workflow
# - 태그 push (v*): 빌드 + GitHub Release 초안 생성

name: Tauri build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            artifact: macos-arm64
            bundle_subpath: aarch64-apple-darwin/release/bundle
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
            artifact: macos-x64
            bundle_subpath: x86_64-apple-darwin/release/bundle
          - platform: windows-latest
            args: ''
            artifact: windows
            bundle_subpath: release/bundle

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check project layout
        run: |
          if [ ! -f study-allocation-app/src-tauri/tauri.conf.json ]; then
            echo "::error::study-allocation-app 폴더가 저장소 루트에 없습니다."
            echo "GitHub Code 탭에 study-allocation-app/ 가 보이는지 확인하세요."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: study-allocation-app/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: study-allocation-app/src-tauri -> target

      - name: Install frontend dependencies
        working-directory: study-allocation-app
        run: npm ci

      - name: Build and release (tag push only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: study-allocation-app
          tagName: v__VERSION__
          releaseName: '나눔교실 프로그램팀 배정 v__VERSION__'
          releaseBody: |
            macOS: `.app` (Apple Silicon / Intel)
            Windows: NSIS 설치 프로그램 (`.exe`)
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Build (manual / non-tag)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: study-allocation-app
          args: ${{ matrix.args }}

      - name: List bundle output (debug)
        if: always()
        run: |
          ROOT="study-allocation-app/src-tauri/target"
          echo "=== target tree (bundle only) ==="
          find "$ROOT" -path '*/bundle/*' 2>/dev/null | head -50 || true
          BUNDLE="${ROOT}/${{ matrix.bundle_subpath }}"
          echo "Expected bundle dir: $BUNDLE"
          ls -laR "$BUNDLE" 2>/dev/null || echo "Bundle directory missing"

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.artifact }}
          path: study-allocation-app/src-tauri/target/${{ matrix.bundle_subpath }}/
          if-no-files-found: error
