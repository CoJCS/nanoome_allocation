# macOS / Windows Tauri 앱 동시 빌드 (GitHub Actions matrix)
# - 수동 실행: Actions 탭 → "Tauri build" → Run workflow
# - 태그 push (v*): 빌드 + GitHub Release 초안 생성
#
# 사전 설정: Repo Settings → Actions → General → Workflow permissions
#   → "Read and write permissions" (Release 업로드 시 필요)

name: Tauri build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            artifact: macos-arm64
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
            artifact: macos-x64
          - platform: windows-latest
            args: ''
            artifact: windows

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: study-allocation-app/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: study-allocation-app/src-tauri -> target

      - name: Install frontend dependencies
        working-directory: study-allocation-app
        run: npm ci

      - name: Build and release (tag push only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: study-allocation-app
          tagName: v__VERSION__
          releaseName: '나눔교실 프로그램팀 배정 v__VERSION__'
          releaseBody: |
            macOS: `.app` (Apple Silicon / Intel)
            Windows: NSIS 설치 프로그램 (`.exe`)

            Assets에서 OS에 맞는 파일을 받아 설치하세요.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Build (manual / non-tag)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: study-allocation-app
          args: ${{ matrix.args }}

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.artifact }}
          path: study-allocation-app/src-tauri/target/release/bundle/**/*
          if-no-files-found: error
