# macOS / Windows Tauri 앱 동시 빌드
# Artifacts: Summary 맨 아래 bundle-windows / bundle-macos-*

name: Tauri build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            artifact: macos-arm64
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
            artifact: macos-x64
          - platform: windows-latest
            args: ''
            artifact: windows

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check project layout
        shell: bash
        run: |
          if [ ! -f study-allocation-app/src-tauri/tauri.conf.json ]; then
            echo "::error::study-allocation-app/ 가 저장소 루트에 없습니다."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: study-allocation-app/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: study-allocation-app/src-tauri -> target

      - name: Install frontend dependencies
        working-directory: study-allocation-app
        run: npm ci

      - name: Build app (release on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: study-allocation-app
          tagName: v__VERSION__
          releaseName: '나눔교실 프로그램팀 배정 v__VERSION__'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Build app
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: study-allocation-app
          args: ${{ matrix.args }}

      - name: Locate bundle folder
        id: bundle
        shell: bash
        run: |
          ROOT="study-allocation-app/src-tauri/target"
          echo "=== directories under target ==="
          find "$ROOT" -maxdepth 4 -type d 2>/dev/null | head -40 || true
          BUNDLE_DIR=$(find "$ROOT" -type d -path '*/release/bundle' 2>/dev/null | head -1)
          if [ -z "$BUNDLE_DIR" ] || [ -z "$(ls -A "$BUNDLE_DIR" 2>/dev/null)" ]; then
            echo "::error::release/bundle 폴더가 비어 있거나 없습니다. 위 Build 단계 로그를 확인하세요."
            exit 1
          fi
          echo "Found bundle at: $BUNDLE_DIR"
          echo "dir=$BUNDLE_DIR" >> "$GITHUB_OUTPUT"

      - name: Ad-hoc sign macOS app
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          BUNDLE_DIR="${{ steps.bundle.outputs.dir }}"
          APP=$(find "$BUNDLE_DIR/macos" -maxdepth 1 -name '*.app' -type d | head -1)
          if [ -z "$APP" ]; then
            echo "::error::.app 번들을 찾을 수 없습니다: $BUNDLE_DIR/macos"
            exit 1
          fi
          echo "Ad-hoc signing: $APP"
          codesign --force --deep --sign - "$APP"
          codesign -vvv --deep --strict "$APP"

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.artifact }}
          path: ${{ steps.bundle.outputs.dir }}
          if-no-files-found: error
