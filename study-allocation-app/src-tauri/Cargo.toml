[package]
name = "study-allocation-app"
version = "0.1.0"
description = "나눔교실 프로그램팀 배정"
authors = ["Nanum Class"]
edition = "2021"

[lib]
name = "study_allocation_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pathfinding = "4"
